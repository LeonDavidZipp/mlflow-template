services:
  mlflow:
    container_name: mlflow
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: "${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}"
      MLFLOW_S3_IGNORE_TLS: "${MLFLOW_S3_IGNORE_TLS:-true}"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-mlflow}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-mlflow123}"
      MLFLOW_BACKEND_STORE_URI: "postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow123}@postgres/${POSTGRES_DB:-mlflow}"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "${MLFLOW_DEFAULT_ARTIFACT_ROOT:-s3://mlflow/}"
      MLFLOW_ARTIFACTS_DESTINATION: "${MLFLOW_ARTIFACTS_DESTINATION:-s3://mlflow/}"
    entrypoint: mlflow server -h 0.0.0.0
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      postgres:
        condition: service_started

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8900}:8900"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-mlflow}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-mlflow123}"
    volumes:
      - "mlflow-minio:/data/minio"
    command: 'minio server /data/minio --console-address ":8900"'
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    container_name: createbuckets
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-mlflow}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-mlflow123}"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb myminio/mlflow --ignore-existing;
      mc anonymous set download myminio/mlflow;
      exit 0;
      "

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mlflow}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-mlflow123}"
      POSTGRES_DB: "${POSTGRES_DB:-mlflow}"
    volumes:
      - "mlflow-postgres:/var/lib/postgresql/data"

volumes:
  db_data:
  mlflow-minio:
    driver: local
  mlflow-postgres:
    driver: local
